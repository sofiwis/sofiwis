    <!-- ... contenido anterior de tu página ... -->
    </div>

    <!-- Traductor Persistente por URL -->
<div class="translator-box">
    <div id="google_translate_element"></div>
</div>

<script type="text/javascript">
  // 1. Obtener idioma desde la URL o localStorage
  var urlParams = new URLSearchParams(window.location.search);
  var currentLang = urlParams.get('lang') || localStorage.getItem('user_lang') || '';

  if (currentLang) {
    document.cookie = "googtrans=/es/" + currentLang + "; path=/";
    document.cookie = "googtrans=/es/" + currentLang + "; domain=" + window.location.hostname + "; path=/";
  }

  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'es',
      includedLanguages: 'en,fr,de,it,pt',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE
    }, 'google_translate_element');

    // 2. Preservar idioma en todos los enlaces del menú
    if (currentLang) {
      document.querySelectorAll('.nav-links a, .btn-primary').forEach(function(link) {
        var page = link.getAttribute('data-page') || link.getAttribute('href');
        if (page && !page.startsWith('http')) {
          link.href = page + '?lang=' + currentLang;
        }
      });
    }

    // 3. Detectar si el usuario cambia el idioma en el desplegable
    var checkSelect = setInterval(function() {
      var select = document.querySelector('.goog-te-combo');
      if (select) {
        clearInterval(checkSelect);
        select.addEventListener('change', function() {
          var lang = this.value;
          if (lang) {
            localStorage.setItem('user_lang', lang);
            window.location.search = '?lang=' + lang;
          } else {
            localStorage.removeItem('user_lang');
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            window.location.href = window.location.pathname;
          }
        });
      }
    }, 400);
  }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
