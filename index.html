<!DOCTYPE html>
<!-- =========================================================
     ESENCIA — INICIO
     ========================================================= -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESENCIA — Creamos tu esencia | Branding y Multimedia</title>
    <meta name="description" content="Creamos identidades visuales memorables, diseño de marca, logos y estrategias multimedia para emprendimientos y empresas.">
    <meta name="theme-color" content="#040509">
    
    <!-- Open Graph / Redes Sociales -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="ESENCIA — Identidad Visual y Multimedia">
    <meta property="og:description" content="Transformamos ideas en identidades visuales auténticas y memorables. Ideas que dejan huella.">
    <meta property="og:image" content="img/esencia-logo.png">

    <link rel="icon" href="img/esencia-logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-outer">

    <div class="card-container">

        <!-- ===== BARRA SUPERIOR ===== -->
        <header class="navbar">
            <a href="index.html" class="brand notranslate" translate="no">
                <img src="img/esencia-logo.png" alt="Logo de ESENCIA" class="logo-img">
                <span class="brand-divider"></span>
                <span class="brand-text notranslate" translate="no">ESENCIA</span>
            </a>

            <button class="menu-btn" aria-label="Abrir menú" aria-expanded="false">&#9776;</button>

            <!-- Menú principal con Portafolio y Acceso -->
            <nav class="nav-links">
                <a href="index.html" class="active">INICIO</a>
                <a href="quienes-somos.html">¿QUIÉNES SOMOS?</a>
                <a href="productos.html">PRODUCTOS</a>
                <a href="portafolio.html">PORTAFOLIO</a>
                <a href="contacto.html">CONTÁCTANOS</a>
                <a href="login.html" class="nav-login-btn">ACCESO</a>
            </nav>
        </header>

        <!-- ===== CONTENIDO DE INICIO ===== -->
        <main class="hero-content">
            <!-- Frase pequeña dorada corregida (sin coma criminal y con tilde) -->
            <div class="eyebrow"><span></span>TU IDENTIDAD ES NUESTRA INSPIRACIÓN<span></span></div>

            <!-- Título principal -->
            <h1 class="hero-title">CREAMOS</h1>

            <!-- Descripción clara y atractiva -->
            <p class="hero-subtitle">Diseñamos tu branding, paleta de colores, logotipo, eslogan y contenido de alto impacto para que tu marca deje huella.</p>

            <!-- Acciones duales: Comenzar o Explorar Portafolio -->
            <div class="hero-actions">
                <a href="contacto.html" class="btn-primary">COMENZAR &#8594;</a>
                <a href="portafolio.html" class="btn-secondary">VER PORTAFOLIO</a>
            </div>
        </main>

        <!-- Frase de la esquina inferior -->
        <div class="corner-motto">Ideas que<br>dejan huella</div>

        <!-- Palabra decorativa del fondo -->
        <div class="marca-fondo notranslate" translate="no">ESENCIA</div>
    </div>

    <!-- Selector de idioma -->
    <div class="language-switcher">
        <span aria-hidden="true">🌐</span>
        <label for="language-select" class="sr-only">Seleccionar idioma</label>
        <select id="language-select" aria-label="Seleccionar idioma">
            <option value="es">ES</option>
            <option value="en">EN</option>
            <option value="pt">PT</option>
            <option value="fr">FR</option>
        </select>
    </div>
    <div id="google_translate_element" aria-hidden="true"></div>

    <script src="main.js"></script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
