<!DOCTYPE html>
<!-- =========================================================
     PÁGINA 1 de 4 — INICIO
     Para cambiar textos, busca los comentarios de abajo.
     ========================================================= -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESENCIA — Creemos tu esencia</title>
    <meta name="description" content="Creamos identidades visuales memorables para emprendimientos y pequeñas empresas.">
    <link rel="icon" href="esencia-logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-outer">

    <!-- Tarjeta grande que contiene toda la página -->
    <div class="card-container">

        <!-- ===== BARRA SUPERIOR (igual en las 4 páginas) ===== -->
        <header class="navbar">
            <a href="index.html" class="brand notranslate" translate="no">
                <img src="esencia-logo.png" alt="Logo de ESENCIA" class="logo-img">
                <span class="brand-divider"></span>
                <span class="brand-text notranslate" translate="no">ESENCIA</span>
            </a>

            <button class="menu-btn" aria-label="Abrir menú">&#9776;</button>

            <!-- Orden del menú: Inicio, ¿Quiénes somos?, Productos, Contáctanos.
                 La clase "active" marca la página en la que estás. -->
            <nav class="nav-links">
                <a href="index.html" class="active">INICIO</a>
                <a href="quienes-somos.html">¿QUIÉNES SOMOS?</a>
                <a href="productos.html">PRODUCTOS</a>
                <a href="contacto.html">CONTÁCTANOS</a>
            </nav>
        </header>

        <!-- ===== CONTENIDO DE INICIO ===== -->
        <main class="hero-content">
            <!-- Frase pequeña dorada sobre el título -->
            <div class="eyebrow"><span></span>TU IDENTIDAD, ES NUESTRA INSPIRACION<span></span></div>

            <!-- Título principal -->
            <h1 class="hero-title">CREEMOS</h1>

            <!-- Descripción corta -->
            <p class="hero-subtitle">Diseñamos tu branding, paleta de colores, logo, eslogan y más.</p>

            <!-- Botón COMENZAR: lleva a la página de contacto -->
            <a href="contacto.html" class="btn-primary">COMENZAR &#8594;</a>
        </main>

        <!-- Frase de la esquina inferior -->
        <div class="corner-motto">Ideas que<br>dejan huella</div>

        <!-- Palabra decorativa del fondo -->
        <div class="marca-fondo notranslate" translate="no">ESENCIA</div>
    </div>

    <!-- Selector discreto; el idioma se conserva en todas las páginas -->
    <div class="language-switcher">
        <span aria-hidden="true">🌐</span>
        <label for="language-select" class="sr-only">Seleccionar idioma</label>
        <select id="language-select" aria-label="Seleccionar idioma">
            <option value="es">ES</option>
            <option value="en">EN</option>
            <option value="pt">PT</option>
            <option value="fr">FR</option>
        </select>
    </div>
    <div id="google_translate_element" aria-hidden="true"></div>

    <script src="main.js"></script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
