<!DOCTYPE html>
<!-- =========================================================
     PÁGINA 3 de 4 — PRODUCTOS
     Cuatro tarjetas: LOGOS, ESLÓGANES, POST y VIDEOS.
     Cada tarjeta es un bloque <div class="product-column">.
     Para cambiar una foto, reemplaza el archivo del src.
     ========================================================= -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos y servicios — ESENCIA</title>
    <meta name="description" content="Logos, eslóganes, publicaciones y videos para comunicar la esencia de tu marca.">
    <link rel="icon" href="esencia-logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-outer">

    <div class="card-container">

        <!-- ===== BARRA SUPERIOR ===== -->
        <header class="navbar">
            <a href="index.html" class="brand notranslate" translate="no">
                <img src="esencia-logo.png" alt="Logo de ESENCIA" class="logo-img">
                <span class="brand-divider"></span>
                <span class="brand-text notranslate" translate="no">ESENCIA</span>
            </a>

            <button class="menu-btn" aria-label="Abrir menú">&#9776;</button>

            <nav class="nav-links">
                <a href="index.html">INICIO</a>
                <a href="quienes-somos.html">¿QUIÉNES SOMOS?</a>
                <a href="productos.html" class="active">PRODUCTOS</a>
                <a href="contacto.html">CONTÁCTANOS</a>
            </nav>
        </header>

        <!-- Frase dorada sobre las tarjetas -->
        <div class="eyebrow" style="margin-top: 26px;"><span></span>Ideas que dan vida a tu marca<span></span></div>

        <!-- ===== LAS CUATRO TARJETAS ===== -->
        <main class="products-grid">

            <!-- Tarjeta 1 -->
            <div class="product-column">
                <h2>LOGOS</h2>
                <p class="product-text">Identidad visual que deja huella.</p>
                <div class="card-box">
                    <img src="servicio-logos.jpg" alt="Ejemplo de logos">
                </div>
            </div>

            <!-- Tarjeta 2 -->
            <div class="product-column">
                <h2>ESLÓGANES</h2>
                <p class="product-text">Frases que conectan, inspiran y venden.</p>
                <div class="card-box">
                    <img src="servicio-eslogans.jpg" alt="Ejemplo de eslóganes">
                </div>
            </div>

            <!-- Tarjeta 3 -->
            <div class="product-column">
                <h2>POST</h2>
                <p class="product-text">Contenido visual que cuenta tu historia.</p>
                <div class="card-box">
                    <img src="servicio-posts.jpg" alt="Ejemplo de publicaciones">
                </div>
            </div>

            <!-- Tarjeta 4 -->
            <div class="product-column">
                <h2>VIDEOS</h2>
                <p class="product-text">Historias en movimiento que generan impacto.</p>
                <div class="card-box">
                    <img src="servicio-videos.jpg" alt="Ejemplo de videos">
                </div>
            </div>
        </main>

        <div class="marca-fondo notranslate" translate="no">ESENCIA</div>
    </div>

    <div class="language-switcher">
        <span aria-hidden="true">🌐</span>
        <label for="language-select" class="sr-only">Seleccionar idioma</label>
        <select id="language-select" aria-label="Seleccionar idioma">
            <option value="es">ES</option>
            <option value="en">EN</option>
            <option value="pt">PT</option>
            <option value="fr">FR</option>
        </select>
    </div>
    <div id="google_translate_element" aria-hidden="true"></div>

    <script src="main.js"></script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
